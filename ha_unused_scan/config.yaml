name: "Nettoyeur de configuration"
version: "1.0.1"
slug: ha_unused_scan
description: "Repère les fichiers packages et automatisations Home Assistant qui ne servent plus, et les archive de façon réversible."
url: "https://github.com/xez7082/ha-unused-scan"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8099
panel_icon: mdi:broom
panel_title: "Nettoyeur"
panel_admin: true
homeassistant_api: true
map:
  - homeassistant_config:rw
options:
  jours_inactifs: 60
schema:
  jours_inactifs: "int(7,3650)"
